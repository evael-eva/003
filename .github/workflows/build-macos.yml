name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ===== v21_mac: 盘口监控邮件提醒 =====
  build-v21:
    name: Build v21_mac - 盘口监控
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v4-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-v4-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Build
      run: |
        cd v21_mac
        pyinstaller --clean --noconfirm 盘口监控邮件提醒.spec

    - name: Package
      run: |
        if [ -d "v21_mac/dist/盘口监控邮件提醒.app" ]; then
          hdiutil create -volname "盘口监控邮件提醒" \
            -srcfolder "v21_mac/dist/盘口监控邮件提醒.app" \
            -ov -format UDZO "v21_mac/dist/盘口监控邮件提醒.dmg"
        elif [ -f "v21_mac/dist/盘口监控邮件提醒/盘口监控邮件提醒" ]; then
          cd v21_mac/dist && zip -r 盘口监控邮件提醒-mac.zip 盘口监控邮件提醒
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: v21_mac-盘口监控邮件提醒
        path: |
          v21_mac/dist/盘口监控邮件提醒.app
          v21_mac/dist/盘口监控邮件提醒.dmg
          v21_mac/dist/盘口监控邮件提醒-mac.zip
        retention-days: 30
        if-no-files-found: warn

  # ===== v22_filter_tool_mac: 比赛初盘筛选工具 =====
  build-v22:
    name: Build v22_mac - 初盘筛选工具
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v4-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-v4-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Build
      run: |
        cd v22_filter_tool_mac
        pyinstaller --clean --noconfirm 比赛初盘筛选工具.spec

    - name: Package
      run: |
        if [ -d "v22_filter_tool_mac/dist/比赛初盘筛选工具.app" ]; then
          hdiutil create -volname "比赛初盘筛选工具" \
            -srcfolder "v22_filter_tool_mac/dist/比赛初盘筛选工具.app" \
            -ov -format UDZO "v22_filter_tool_mac/dist/比赛初盘筛选工具.dmg"
        elif [ -f "v22_filter_tool_mac/dist/比赛初盘筛选工具/比赛初盘筛选工具" ]; then
          cd v22_filter_tool_mac/dist && zip -r 比赛初盘筛选工具-mac.zip 比赛初盘筛选工具
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: v22_mac-比赛初盘筛选工具
        path: |
          v22_filter_tool_mac/dist/比赛初盘筛选工具.app
          v22_filter_tool_mac/dist/比赛初盘筛选工具.dmg
          v22_filter_tool_mac/dist/比赛初盘筛选工具-mac.zip
        retention-days: 30
        if-no-files-found: warn

  # ===== Release (on tag) =====
  release:
    name: Create Release
    needs: [ build-v21, build-v22 ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: 'v*'
        merge-multiple: true
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f

    - uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
