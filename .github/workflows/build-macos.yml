name: Build macOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-v2-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        
    - name: Build with PyInstaller
      run: |
        cd v21
        echo "=== Building ==="
        pyinstaller --clean --log-level=INFO --noconfirm 盘口监控邮件提醒.spec 2>&1
        echo "=== Build exit code: $? ==="
        ls -lh dist/ 2>/dev/null || echo "No dist folder"
        ls -lh build/ 2>/dev/null || echo "No build folder"
        
    - name: Check output
      run: |
        echo "=== v21/dist/ ==="
        find v21/dist -type f -o -type d 2>/dev/null | head -50
        echo ""
        if [ -d "v21/dist/盘口监控邮件提醒.app" ]; then
          echo "✅ .app bundle found!"
        elif [ -f "v21/dist/盘口监控邮件提醒" ]; then
          echo "✅ binary found (no bundle)"
        else
          echo "⚠️ No expected output found"
        fi
        
    - name: Create DMG
      run: |
        if [ -d "v21/dist/盘口监控邮件提醒.app" ]; then
          hdiutil create -volname "盘口监控邮件提醒" \
            -srcfolder "v21/dist/盘口监控邮件提醒.app" \
            -ov -format UDZO \
            "v21/dist/盘口监控邮件提醒.dmg"
          ls -lh v21/dist/*.dmg
        elif [ -f "v21/dist/盘口监控邮件提醒" ]; then
          # 如果没有 .app，打包成 .zip
          cd v21/dist
          zip -r 盘口监控邮件提醒-mac.zip 盘口监控邮件提醒
          ls -lh *.zip
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Build
        path: |
          v21/dist/盘口监控邮件提醒.app
          v21/dist/盘口监控邮件提醒.dmg
          v21/dist/盘口监控邮件提醒-mac.zip
          v21/dist/盘口监控邮件提醒
        retention-days: 30
        if-no-files-found: warn
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          v21/dist/盘口监控邮件提醒.app
          v21/dist/盘口监控邮件提醒.dmg
          v21/dist/盘口监控邮件提醒-mac.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
